<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sphere Trajectory Simulator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="panel">
      <h1>3D Sphere Trajectory Simulator</h1>
      <p class="subtitle">Configure the launcher and run/export an animated simulation.</p>

      <div class="grid">
        <label>Launch speed (FPS)
          <input id="fps" type="number" min="1" max="30000" value="1200" />
        </label>

        <label>Cylinder diameter (in)
          <input id="cylinderDiameter" type="number" step="0.01" min="1" max="6" value="3" />
        </label>

        <label>Sphere size (in)
          <input id="sphereDiameter" type="number" step="0.01" min="0.1" max="1" value="0.3" />
        </label>

        <label>Sphere spacing (in)
          <input id="sphereSpacing" type="number" step="0.01" min="0" max="0.25" value="0.02" />
        </label>

        <label>Vertical rows
          <input id="rows" type="number" min="1" max="250" value="8" />
        </label>

        <label>Inset rows (layers)
          <input id="insetRows" type="number" min="1" max="250" value="2" />
        </label>

        <label>Sphere density
          <select id="density">
            <option value="2700">Aluminum (2700 kg/m³)</option>
            <option value="7850" selected>Steel (7850 kg/m³)</option>
            <option value="8960">Copper (8960 kg/m³)</option>
            <option value="11340">Lead (11340 kg/m³)</option>
            <option value="3900">Alumina Ceramic (3900 kg/m³)</option>
            <option value="3200">Silicon Carbide Ceramic (3200 kg/m³)</option>
            <option value="6000">Tungsten Carbide Ceramic (6000 kg/m³)</option>
          </select>
        </label>
      </div>

      <div class="button-row">
        <button id="runBtn">Run simulation</button>
        <button id="resetBtn" class="secondary">Reset camera</button>
      </div>

      <div class="button-row">
        <button id="recordBtn">Record animation (WebM)</button>
        <button id="exportConfigBtn" class="secondary">Export config (JSON)</button>
        <button id="exportCsvBtn" class="secondary">Export speeds (CSV)</button>
      </div>

      <div id="metrics" class="metrics"></div>
      <small>
        Model: idealized drag-only trajectory in 3D; use as a comparative design tool, not a certified ballistic predictor.
      </small>
    </aside>

    <main class="viewport-wrap">
      <canvas id="sceneCanvas"></canvas>
    </main>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
